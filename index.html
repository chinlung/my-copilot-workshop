<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="簡單、離線可用的待辦清單">
  <title>今天做什麼｜待辦清單</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="todo-card" aria-labelledby="page-title">
      <header class="app-header">
        <div class="header-topline">
          <p class="eyebrow">DAILY DESK</p>
          <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false">
            <span id="theme-toggle-icon" aria-hidden="true">🌙</span>
            <span id="theme-toggle-label">深色模式</span>
          </button>
        </div>
        <h1 id="page-title">今天做什麼？</h1>
        <p class="intro">把腦中的下一步，放到手邊看得見的地方。</p>
      </header>

      <form id="todo-form" class="todo-form" autocomplete="off">
        <label class="sr-only" for="todo-input">新增待辦事項</label>
        <input
          id="todo-input"
          class="todo-input"
          type="text"
          placeholder="例如：回覆設計稿"
          maxlength="100"
          required
        >
        <button class="add-button" type="submit">新增待辦</button>
      </form>

      <div class="filter-bar" role="group" aria-label="篩選待辦事項">
        <button class="filter-button is-active" type="button" data-filter="all" aria-pressed="true">全部</button>
        <button class="filter-button" type="button" data-filter="active" aria-pressed="false">未完成</button>
        <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">已完成</button>
      </div>

      <div class="list-heading">
        <h2>我的清單</h2>
        <span class="list-mark" aria-hidden="true"></span>
      </div>

      <ul id="todo-list" class="todo-list" aria-live="polite"></ul>
      <p id="empty-state" class="empty-state" hidden>還沒有任何待辦事項,新增一個吧!</p>

      <footer class="app-footer">
        <span id="remaining-count">未完成:0 項</span>
        <span class="saved-note">自動儲存於此裝置</span>
      </footer>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
